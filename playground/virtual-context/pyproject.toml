[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-context"
version = "0.1.0"
description = "MemGPT-style external memory for LLM agents, with Generative-Agents retrieval (relevance + recency + importance)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Keyan Mikaili" }]
keywords = ["llm", "agents", "memory", "memgpt", "generative-agents", "sqlite"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
virtual-context = "virtual_context.cli:main"

[tool.setuptools]
packages = ["virtual_context"]
