[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router"
version = "0.1.0"
description = "A small, explainable, cost-aware router that picks the best-fit LLM per request."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Keyan Mikaili" }]
keywords = ["llm", "routing", "model-selection", "agents", "cost-optimization"]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=7", "pyyaml>=6"]

[project.scripts]
llm-router = "llm_router.cli:main"

[tool.setuptools]
packages = ["llm_router"]
