[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-memory"
version = "0.1.0"
description = "A structured, temporal, queryable memory layer for LLM agents — beyond a pile of markdown files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Keyan Mikaili" }]
keywords = ["llm", "agents", "memory", "rag", "sqlite", "harness"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
llm-memory = "llm_memory.cli:main"

[tool.setuptools]
packages = ["llm_memory"]
