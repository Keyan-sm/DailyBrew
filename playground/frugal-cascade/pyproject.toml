[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frugal-cascade"
version = "0.1.0"
description = "FrugalGPT-style LLM cascade + RouteLLM-style routing: cheap model first, escalate on low confidence."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Keyan Mikaili" }]
keywords = ["llm", "llm-cascade", "frugalgpt", "routellm", "llm-routing", "cost-optimization"]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=7", "pyyaml>=6"]

[project.scripts]
frugal-cascade = "frugal_cascade.cli:main"

[tool.setuptools]
packages = ["frugal_cascade"]
